# Production SPA host. Traefik terminates TLS and routes the API on its own
# hostname (DOMAIN_API), so this server only ever serves static files — there
# is deliberately no proxy location here.
#
# ---------------------------------------------------------------------------
# THIS FILE IS AN ENVSUBST TEMPLATE.
#
# frontend/Dockerfile installs it at /etc/nginx/templates/default.conf.template.
# The stock nginx image's /docker-entrypoint.d/20-envsubst-on-templates.sh
# renders it into /etc/nginx/conf.d/default.conf at container start.
#
# envsubst is handed an explicit allow-list of variable names built from the
# container environment, so nginx's own $-variables ($uri, $http_upgrade, ...)
# are left alone — they are lowercase and never appear in the environment.
# NGINX_ENVSUBST_FILTER=^CSP_ in the stack files narrows that further.
#
# Only these are interpolated:
#   CSP_EXTRA_CONNECT  extra connect-src origins. DEFAULTED, not configured:
#                      docker-entrypoint.d/15-csp-connect-default.envsh derives
#                      "https://<origin> wss://<origin>" from the VITE_API_URL
#                      build arg — the same origin baked into the SPA bundle —
#                      so the policy cannot drift from the app it protects.
#                      Set it in the environment only to ADD an origin; doing
#                      so REPLACES the derived value.
#   CSP_EXTRA_IMG      extra img-src origins (e.g. an object-store CDN)
#
# Both mirror the backend's env knobs in
# backend/app/middleware/security_headers.py. An unset variable renders as the
# empty string, so a stack that forgets to set them degrades to a same-origin
# CSP — never to a missing or empty CSP header.
# ---------------------------------------------------------------------------

# Cache-Control is driven by a map rather than a per-location add_header. See
# the note in the server block for why that distinction matters.
map $uri $integral_cache_control {
    # Empty value => nginx omits the header entirely, preserving the previous
    # behaviour of sending Cache-Control on /assets/ only.
    default    "";
    # Vite content-hashed assets.
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every header below is set at SERVER level on purpose.
    #
    # nginx's add_header inheritance is all-or-nothing: one add_header inside a
    # location block discards *every* add_header inherited from the enclosing
    # block. The old per-location `add_header Cache-Control` in /assets/ would
    # therefore have silently stripped the whole security header set from every
    # JS and CSS response. Driving Cache-Control from the map above means no
    # location needs its own add_header, so these apply everywhere.
    #
    # `always` sends them on error responses (404/50x) too.
    add_header Cache-Control $integral_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self): the chat composer's dictation button captures audio on
    # this origin only. Mirrors PERMISSIONS_POLICY in
    # backend/app/middleware/security_headers.py.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Safe here because Traefik always fronts this with TLS. Omitted from
    # nginx.docker.conf, which serves plain http on localhost.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP must stay on ONE line — nginx permits newlines inside a quoted string
    # and would emit them verbatim into the header value.
    #
    # Deviations from a bare `default-src 'self'`, each tied to real app code:
    #   script-src   two sha256 hashes for the inline <script> blocks in
    #                frontend/index.html (the `globalThis.process` shim and the
    #                pre-paint theme bootstrap). Vite copies them byte-for-byte
    #                into dist/index.html. Guarded by
    #                .ci/csp_inline_script_hash_check.sh — edit either script
    #                without updating these and the guard fails.
    #                cdn.jsdelivr.net serves the pdf.js worker (see worker-src).
    #   style/font   rsms.me hosts the Inter webfont pulled in by index.html.
    #                style-src keeps 'unsafe-inline' because the bundle
    #                INJECTS <style> ELEMENTS at runtime — audited 2026-08-12
    #                against the production build served under a hardened
    #                policy (style-src 'self' + style-src-attr 'unsafe-inline'):
    #                login renders clean, but four chunks call
    #                createElement(`style`): chat-markdown-vendor (Shiki code
    #                highlighting), wiki-tiptap (ProseMirror), pdf
    #                (pdfjs-dist), and AppDetailPage. Dropping 'unsafe-inline'
    #                breaks chat, wiki and the PDF viewer at runtime while
    #                healthchecks stay green. Re-attempt only by giving those
    #                libraries a nonce or moving them to constructable
    #                stylesheets upstream — re-run the audit, don't trust this
    #                comment: grep dist/assets for createElement(`style`).
    #                TODO(csp): style-src still allows 'unsafe-inline' for
    #                Tailwind / runtime style attrs. Do NOT drop it until we
    #                have a hashing/nonce plan (mirrors script-src sha256
    #                treatment) — removing it without hashes breaks the SPA.
    #   worker-src   pdf.js wraps its cross-origin worker in a blob: URL that
    #                dynamic-imports the CDN build (PDFWorker._createCDNWrapper
    #                in pdfjs-dist). Needs blob: here and the CDN in script-src.
    #   img/media    attachments and avatars render from blob: object URLs.
    #   connect-src  https://api.openai.com — speech-to-text dictation opens its
    #                realtime transcription session from the browser (WebRTC
    #                SDP exchange over fetch) with a short-lived client secret
    #                the backend mints; the API key never reaches the browser.
    #                A literal, placed BEFORE ${CSP_EXTRA_CONNECT}, so setting
    #                that variable can only add origins, never drop this one.
    #                Mirrors SPEECH_CONNECT_ORIGINS in security_headers.py.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; frame-src 'self' ${CSP_EXTRA_CONNECT}; script-src 'self' 'sha256-8Ys63/7YsCP9vUB/gyQiX5Rk/bl/X2JAwpfAf/fefs4=' 'sha256-cgS8nIyeS/SjpO72ZodpZcWitrXPXYWUOmv0yRn4jtE=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://rsms.me; font-src 'self' data: https://rsms.me; img-src 'self' data: blob: ${CSP_EXTRA_IMG}; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://api.openai.com ${CSP_EXTRA_CONNECT}" always;

    # Module workers require a JavaScript MIME type under nosniff.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
