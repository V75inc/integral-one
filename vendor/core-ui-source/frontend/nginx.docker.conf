# Local Docker — SPA + reverse proxy to the API container (same-origin /api, /ws).
# Used by docker-compose.local.yml via Dockerfile NGINX_CONF build-arg.
#
# Like nginx.conf this is an ENVSUBST TEMPLATE rendered at container start —
# see the header comment there for the mechanism and the CSP_* variables.
#
# Differences from nginx.conf, both deliberate:
#   * No Strict-Transport-Security. This serves plain http on localhost, and
#     an HSTS pin on localhost would poison every other local project on the
#     same host.
#   * The security headers are inherited by the /api/, /ws/ and /health proxy
#     locations, so those responses carry both these headers and the ones
#     SecurityHeadersMiddleware sets on the backend. Harmless — a duplicate CSP
#     only ever narrows enforcement, and these are JSON/WebSocket responses
#     that execute nothing. Keeping one server-level block instead of
#     per-location copies is what stops the two static locations from drifting.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# See nginx.conf — Cache-Control comes from a map so that no location needs its
# own add_header, which would discard every inherited security header.
map $uri $integral_cache_control {
    default    "";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default nginx limit is 1m, which returns 413 on ordinary attachments.
    # Matches ATTACHMENT_MAX_UPLOAD_BYTES (500 MiB) in backend/app/config.py.
    client_max_body_size 500m;

    add_header Cache-Control $integral_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) for chat dictation — see nginx.conf.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Keep in sync with nginx.conf — the inline-script hashes are checked
    # against frontend/index.html by .ci/csp_inline_script_hash_check.sh.
    # RESOLVED-AS-RESIDUAL(csp, 2026-08-12): style-src keeps 'unsafe-inline'.
    # Audited against the production build under a hardened policy: four
    # chunks inject <style> at runtime (chat-markdown-vendor/Shiki,
    # wiki-tiptap/ProseMirror, pdf/pdfjs-dist, AppDetailPage). Dropping the
    # directive breaks chat, wiki and the PDF viewer. Full audit note in
    # nginx.conf; re-run the grep there before re-attempting.
    # connect-src carries https://api.openai.com for browser-direct dictation
    # (see nginx.conf) — literal before ${CSP_EXTRA_CONNECT} so it can't be
    # dropped by an env override.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; frame-src 'self' ${CSP_EXTRA_CONNECT}; script-src 'self' 'sha256-8Ys63/7YsCP9vUB/gyQiX5Rk/bl/X2JAwpfAf/fefs4=' 'sha256-cgS8nIyeS/SjpO72ZodpZcWitrXPXYWUOmv0yRn4jtE=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://rsms.me; font-src 'self' data: https://rsms.me; img-src 'self' data: blob: ${CSP_EXTRA_IMG}; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://api.openai.com ${CSP_EXTRA_CONNECT}" always;

    # Module workers require a JavaScript MIME type under nosniff.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # The validated frame response owns its sandbox/hash-only CSP. Defining
    # headers here intentionally suppresses the SPA header inheritance.
    location = /api/extension-view-frame {
        access_log off; # the short-lived document grant is in the query string
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /ws/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
