<!DOCTYPE html>
<html lang="en">

<head>
  <link id="app-favicon" rel="icon" type="image/svg+xml" href="/integral-logo.svg?v=system-theme"
    data-dark="/integral-logo-white.svg?v=system-theme" data-light="/integral-logo.svg?v=system-theme" />
  <script>
    globalThis.process = globalThis.process || { env: { NODE_ENV: 'development' } };
  </script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('t75_theme');
        var dark = t !== 'light';
        document.documentElement.classList.toggle('theme-dark', dark);
      } catch (e) {
        document.documentElement.classList.add('theme-dark');
      }
      var icon = document.getElementById('app-favicon');
      var systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      function updateFavicon() {
        icon.href = systemTheme.matches ? icon.dataset.dark : icon.dataset.light;
      }
      updateFavicon();
      systemTheme.addEventListener('change', updateFavicon);
    })();
  </script>
  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=split-square" />
  <link rel="manifest" href="/site.webmanifest?v=split-square" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Integral connects your tracks, spaces, and teams—one workspace to see what matters across your professional life." />
  <title>Integral</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
</head>

<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
