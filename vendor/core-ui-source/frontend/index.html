    globalThis.process = globalThis.process || { env: { NODE_ENV: 'development' } };
  </script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('t75_theme');
        if (t === 'light') document.documentElement.classList.remove('theme-dark');
        else document.documentElement.classList.add('theme-dark');
      } catch (e) {
        document.documentElement.classList.add('theme-dark');
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="/integral-logo-white.svg?v=split-square" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=split-square" />
