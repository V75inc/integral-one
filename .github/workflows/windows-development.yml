name: Windows development installer (unsigned, manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.3
      - run: npm run setup
      - run: npm run verify
      - run: npm run test:ui
      - run: npm run build:installers
      - run: node scripts/inspect-package.js
      - uses: actions/upload-artifact@v4
        with:
          name: integral-one-windows-x64-UNSIGNED-development
          retention-days: 7
          if-no-files-found: error
          path: release/integral-one-*-win-x64.exe
# No signing secrets, production account config, public manifest or publication.
# For controlled Windows qualification only; never link this as a user release.
