name: One foundation qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.3
      - run: npm ci
      - run: npm run verify
      - run: npm run qualify:ui
      - if: runner.os == 'Linux'
        run: npm run test:ui
      - run: npm run build:runtime
      - run: npm run build:accounts
      - run: npx electron-builder --dir --publish never
      - run: node scripts/inspect-package.js
      - name: Build unsigned Windows development installer
        if: runner.os == 'Windows'
        run: npm run build:installers
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: integral-one-windows-x64-UNSIGNED-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: release/integral-one-*-win-x64.exe
# No release/publish job: official registration and signed installer qualification remain gates.
